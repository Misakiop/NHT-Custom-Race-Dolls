/* 导出标签页：高亮 + 呼吸光 */
.tab--export{color:#ffb454;position:relative}
.tab--export .tab__ico{width:13px;height:13px;margin-right:4px;vertical-align:-2px}
.tab--export.is-on{color:#ffd08a;text-shadow:0 0 10px rgba(255,180,84,.55)}
.tab--export.is-on::after{content:'';position:absolute;left:6px;right:6px;bottom:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,180,84,0),#ffb454,rgba(255,180,84,0));animation:tabGlow 1.8s ease-in-out infinite}
@keyframes tabGlow{0%,100%{opacity:.45}50%{opacity:1}}
/* 多选窗口：分组标题整行可点、箭头变大 */
.mxgrp__h{cursor:pointer}
.mxgrp__chev{font-size:14px;line-height:1;width:16px;text-align:center;padding:0}
/* 导出模组文件：最特殊的黑彩按钮 */
.btn--modx{background:linear-gradient(135deg,#0b0b10 0%,#1a1030 40%,#10201f 70%,#0b0b10 100%);
  border:1px solid rgba(160,120,255,.55);color:#e9e2ff;position:relative;overflow:hidden}
.btn--modx svg{color:#b98cff}
.btn--modx:hover{border-color:rgba(200,170,255,.95);color:#fff}
.btn--modx::after{content:'';position:absolute;inset:-60% -30%;background:linear-gradient(115deg,transparent 40%,rgba(180,140,255,.35) 50%,rgba(120,255,220,.30) 56%,transparent 64%);
  transform:translateX(-60%);animation:modxSheen 3.4s ease-in-out infinite;pointer-events:none}
@keyframes modxSheen{0%,100%{transform:translateX(-70%)}55%{transform:translateX(70%)}}
.mxdirty{border:1px solid rgba(255,120,90,.45);background:rgba(255,90,60,.07);border-radius:6px;padding:8px 10px;margin:0 0 8px}
.mxdirty b{color:#ff9a86}
.mxdirty ul{margin:4px 0 0;padding-left:18px;font-size:11px;color:#e6c0b6}

/* 设置窗口：背景整体模糊，警告徽标不受影响（z-index 更高，不会被打模糊） */
.modal.is-focus{background:rgba(6,8,9,.86);backdrop-filter:blur(7px) saturate(.9)}

/* 隐藏 HAR 预览边框：去掉角标文字与缩放手柄 */
.hairprev.no-frame::after{display:none !important}
.hairprev.no-frame .hairprev__grip{display:none !important}

/* Git 同步区块 */
.gitbox{border:1px solid rgba(120,160,255,.28);border-radius:8px;padding:9px 10px;background:rgba(70,110,220,.06)}
.gitrow{display:flex;flex-wrap:wrap;gap:7px;align-items:stretch}
.gitbtn{position:relative;flex:1 1 128px;min-width:112px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  padding:8px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.16);cursor:pointer;font-size:11.5px;
  background:rgba(255,255,255,.05);color:#dfe6e9;overflow:hidden}
.gitbtn:disabled{opacity:.55;cursor:default}
/* Push：紫蓝渐变 + 流光 */
.gitbtn--push{background:linear-gradient(135deg,#2b2350,#1c2b52 55%,#12203a);border-color:rgba(140,170,255,.5);color:#e6ecff}
.gitbtn--push::after{content:'';position:absolute;inset:-60% -40%;pointer-events:none;
  background:linear-gradient(115deg,transparent 42%,rgba(150,180,255,.35) 50%,transparent 60%);
  transform:translateX(-70%);animation:gitSheen 3.2s ease-in-out infinite}
.gitbtn--push:hover{border-color:rgba(170,200,255,.9);color:#fff}
/* Pull：青绿发光，有更新时呼吸+抖动 */
.gitbtn--pull{background:linear-gradient(135deg,#0f3a34,#123c46 60%,#0d2a30);border-color:rgba(90,220,190,.5);color:#dffaf3}
.gitbtn--pull:hover{border-color:rgba(120,240,210,.95);color:#fff}
.gitbtn--pull.has-new{animation:gitGlow 1.3s ease-in-out infinite, gitShake 1.9s ease-in-out infinite}
@keyframes gitSheen{0%,100%{transform:translateX(-70%)}55%{transform:translateX(70%)}}
@keyframes gitGlow{0%,100%{box-shadow:0 0 0 0 rgba(90,220,190,0)}50%{box-shadow:0 0 14px 3px rgba(90,220,190,.65)}}
@keyframes gitShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
.gitbtn .gitbadge{position:absolute;top:2px;right:2px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;
  background:#ff6b5a;color:#fff;font:600 10px/16px var(--font-mono);text-align:center;box-shadow:0 0 0 2px rgba(15,20,22,.9)}
.gitbtn.is-ok{animation:gitOk .9s ease-out 2}
@keyframes gitOk{0%{box-shadow:0 0 0 0 rgba(120,240,160,.75)}100%{box-shadow:0 0 0 14px rgba(120,240,160,0)}}
.gitbtn.is-fail{animation:gitFail .5s ease-in-out 3}
@keyframes gitFail{0%,100%{transform:translateX(0);border-color:rgba(255,110,90,.9)}50%{transform:translateX(-3px)}}
.gitstat{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:10.5px;color:#8d9499}
.gitstat b{color:#cfd7da}
.gitlog{margin-top:7px}
.gitlog summary{cursor:pointer;font-size:10.5px;color:#9aa3a7;list-style:none}
.gitlog summary::-webkit-details-marker{display:none}
.gitlog summary::before{content:'▸ ';color:#8d9499}
.gitlog[open] summary::before{content:'▾ '}
.gitlog__b{margin-top:5px;max-height:180px;overflow:auto;border:1px solid rgba(255,255,255,.09);border-radius:6px;
  background:rgba(0,0,0,.25);padding:6px 8px;font:10.5px/1.6 var(--font-mono);color:#c3ccd0;white-space:pre-wrap}
.gitlog__err{color:#ffb4a8}
/* 通知里的 git 卡片 */
.gcard{border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:7px 9px;margin:0 0 6px;background:rgba(255,255,255,.03)}
.gcard__d{font:10px/1.4 var(--font-mono);color:#7f888c;margin-bottom:2px}
.gcard__s{font-size:11.5px;color:#e4eaed}
.gcard__h{font:10px/1.4 var(--font-mono);color:#6f777b;margin-top:2px}
/* 设置里的选项卡 */
.setabs{display:flex;gap:6px;margin:0 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.setab{padding:4px 10px;border-radius:5px;border:1px solid transparent;background:none;color:#9aa3a7;cursor:pointer;font-size:11.5px}
.setab.is-on{background:rgba(255,255,255,.08);border-color:var(--line-2);color:#fff}

/* 「收到」按钮：醒目 + 呼吸提醒 */
.btn--ack{background:linear-gradient(135deg,#c98a1f,#e3b558 55%,#a86f14);border:1px solid rgba(255,214,130,.75);
  color:#241a06;font-weight:700;box-shadow:0 0 0 0 rgba(227,181,88,.55);animation:ackPulse 1.6s ease-in-out infinite}
.btn--ack:hover{background:linear-gradient(135deg,#e0a02c,#ffcf70 55%,#c08318);color:#1c1404}
@keyframes ackPulse{0%,100%{box-shadow:0 0 0 0 rgba(227,181,88,.55)}50%{box-shadow:0 0 0 7px rgba(227,181,88,0)}}

/* Git 按钮里的图标：不给尺寸会被 svg 默认 300x150 撑爆 */
.gitbtn svg{width:14px;height:14px;flex:0 0 auto}

/* Git 按钮：亮色 */
.gitbtn--push{background:linear-gradient(135deg,#4b63ff,#6f8cff 55%,#3f55d8);border-color:rgba(170,190,255,.85);color:#fff}
.gitbtn--push::after{background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.45) 50%,transparent 60%)}
.gitbtn--push:hover{background:linear-gradient(135deg,#5b72ff,#8aa4ff 55%,#4d63e6)}
.gitbtn--pull{background:linear-gradient(135deg,#1fd1a5,#28c7d8 55%,#12a58c);border-color:rgba(160,255,235,.85);color:#04231e}
.gitbtn--pull:hover{background:linear-gradient(135deg,#2ce4b8,#3ad6e6 55%,#17b89b)}
/* 「收到」在有新通知时和图标一起抖 */
.btn--ack.attn{animation:ackPulse 1.6s ease-in-out infinite, attnShake 1.9s ease-in-out infinite}
/* 导出模组文件：去掉流光特效 */
.btn--modx::after{display:none !important;animation:none !important}
/* 同步状态说明单独一行 */
.gitstat--note{display:block;margin-top:3px;color:#7f888b}

/* ==== Git 按钮：高级暗色（黑曜 + 细流光，和导出模组文件同一路数） ==== */
.gitbtn{background:linear-gradient(135deg,#0e0f14,#151a26 52%,#0a0c10);
  border:1px solid rgba(255,255,255,.14);color:#dfe6e9;font-weight:600;letter-spacing:.02em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 4px 14px rgba(0,0,0,.45);transition:box-shadow .18s,border-color .18s}
.gitbtn:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 6px 20px rgba(0,0,0,.6)}
.gitbtn--push{background:linear-gradient(135deg,#0b0b12,#191233 52%,#090a10);border-color:rgba(150,120,255,.5);color:#e9e2ff}
.gitbtn--push:hover{border-color:rgba(180,155,255,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.09), 0 6px 22px rgba(120,90,255,.28)}
.gitbtn--pull{background:linear-gradient(135deg,#0a100e,#0f2621 52%,#080f0d);border-color:rgba(110,235,205,.45);color:#dcfaf1}
.gitbtn--pull:hover{border-color:rgba(140,255,225,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 6px 22px rgba(60,220,180,.22)}
/* 细流光：只在 hover 时扫过一次，不抢眼 */
.gitbtn--push::after,.gitbtn--pull::after{opacity:0;transition:opacity .2s;animation:none}
.gitbtn--push:hover::after{opacity:1;background:linear-gradient(115deg,transparent 44%,rgba(170,150,255,.30) 50%,transparent 58%);
  animation:gitSheen 1.2s ease-in-out}
.gitbtn--pull:hover::after{opacity:1;background:linear-gradient(115deg,transparent 44%,rgba(130,255,225,.28) 50%,transparent 58%);
  animation:gitSheen 1.2s ease-in-out}
/* 状态行均分 */
.gitstat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.gitstat > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gitstat--noteRow{display:flex;align-items:center;gap:6px;text-align:left;margin-top:4px}
.gitstat--noteRow .gitstat__ico{flex:0 0 auto;width:20px;height:20px;display:flex;align-items:center;justify-content:center;
  border-radius:5px;border:1px solid rgba(255,255,255,.14);color:#9aa3a7;cursor:pointer;background:rgba(255,255,255,.04)}
.gitstat--noteRow .gitstat__ico:hover{color:#fff;border-color:rgba(160,220,255,.7)}
.gitstat--noteRow .gitstat__ico svg{width:12px;height:12px}

/* ==== Git 提醒特效加强 ==== */
/* 有新提交：常亮青边 + 呼吸光 + 抖动 + 红点计数（一直提醒直到拉取） */
.gitbtn--pull.has-new{
  border-color:rgba(140,255,225,.95) !important;
  box-shadow:0 0 18px rgba(60,220,180,.38), inset 0 1px 0 rgba(255,255,255,.10) !important;
  animation:gitGlow 1.25s ease-in-out infinite, gitShake 1.9s ease-in-out infinite;
  color:#eafff9;
}
.gitbtn.has-new .gitbadge{animation:badgePop .5s ease-out}
@keyframes badgePop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
/* 成功：绿色描边 + 内圈扩散，闪 3 次 */
.gitbtn.is-ok{border-color:rgba(120,240,160,.95) !important;
  animation:gitOk .9s ease-out 3, gitOkFill .9s ease-out 3}
@keyframes gitOkFill{0%{box-shadow:inset 0 0 0 0 rgba(120,240,160,.55)}
  100%{box-shadow:inset 0 0 0 30px rgba(120,240,160,0)}}
/* 失败：红色描边 + 抖动，闪 4 次，并保持红色描边直到下次操作 */
.gitbtn.is-fail{border-color:rgba(255,110,90,.95) !important;
  animation:gitFail .42s ease-in-out 4, gitFailFill .42s ease-in-out 4;
  color:#ffd9d2}
@keyframes gitFailFill{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,90,70,.5)}
  50%{box-shadow:inset 0 0 0 26px rgba(255,90,70,.16)}}

/* 推送按钮：常驻的缓慢微光（提示“这是个主操作”） */
.gitbtn--push::after{opacity:.55 !important;animation:gitSheen 5.5s ease-in-out infinite !important}
.gitbtn--push:hover::after{opacity:1 !important;animation:gitSheen 1.1s ease-in-out !important}

/* Git 状态行：图标按钮 + 彩色状态文字 */
.gitstate-row{display:flex;align-items:center;gap:7px;margin-top:7px}
.gitico{flex:0 0 auto;width:24px;height:22px;display:flex;align-items:center;justify-content:center;
  border-radius:5px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#9aa3a7;cursor:pointer}
.gitico:hover{color:#fff;border-color:rgba(160,220,255,.75);background:rgba(120,190,255,.12)}
.gitico svg{width:12px;height:12px}
.gitstate{font-size:10.5px;line-height:1.5;min-width:0;overflow:hidden;text-overflow:ellipsis}
.gitstate.is-ok{color:#7ee0a8}
.gitstate.is-fail{color:#ff9a86}
.gitstate.is-idle{color:#7f888b}
/* 设置里的只读提示行 */
.setnote{font-size:10.5px;line-height:1.65;color:#8d9499;margin:2px 0 8px}
.setnote b{color:#cfd7da}
.setwarn{font-size:10.5px;line-height:1.65;color:#ffcf70;background:rgba(227,181,88,.08);
  border:1px solid rgba(227,181,88,.28);border-radius:6px;padding:7px 9px;margin:6px 0 10px}
.setwarn b{color:#ffb454}
.gitlocal{font-size:10.5px;margin:0 0 8px;padding:6px 8px;border-radius:6px;border:1px dashed rgba(255,255,255,.14);color:#9aa3a7}
.gitlocal b{color:#d7dde0}
.gitlocal.is-ok{border-color:rgba(120,224,168,.4)}
.gitlocal.is-fail{border-color:rgba(255,110,90,.45);color:#ffb4a8}

.setlog{margin-top:8px;border:1px solid rgba(255,255,255,.1);border-radius:6px;background:rgba(0,0,0,.28);
  max-height:170px;overflow:auto;padding:7px 9px;font:10.5px/1.6 var(--font-mono);color:#c3ccd0;white-space:pre-wrap}
.setlog:empty::before{content:'（暂无日志）';color:#6f777b}
.setstat-ok{color:#7ee0a8}
.setstat-fail{color:#ff9a86}
.setstat-idle{color:#8d9499}

/* 分支输入非法（main） */
.inp.is-bad{border-color:rgba(255,107,90,.9) !important;color:#ffb4a8 !important;background:rgba(255,90,70,.08)}
.badhint{font-size:10.5px;color:#ff9a86;margin:2px 0 0}
/* REPO 区块右下角小齿轮 */
.gitgear{display:flex;justify-content:flex-end;margin-top:6px}
.gitgear .gitico{width:22px;height:22px}
.gitgear .gitico.is-bad{color:#ff9a86;border-color:rgba(255,107,90,.75);background:rgba(255,90,70,.10);
  animation:gitShake 1.6s ease-in-out infinite}
.gitgear .gitico.is-ok{color:#7ee0a8;border-color:rgba(120,224,168,.55)}
/* 仓库地址行 */
.repoline{display:flex;align-items:center;gap:6px;font:10.5px/1.6 var(--font-mono);color:#9aa3a7;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:5px 8px;margin:2px 0 8px}
.repoline b{color:#d7dde0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repoline .iconbtn{margin-left:auto}

/* 统一悬浮气泡：更精致的暗色卡片 */
.qpop{position:fixed;z-index:65000;width:min(320px,calc(100vw - 24px));max-height:min(340px,62vh);overflow:auto;
  padding:9px 12px;border-radius:10px;font-size:11.5px;line-height:1.7;color:#e6edf0;
  background:linear-gradient(180deg,rgba(26,31,36,.98),rgba(16,20,23,.98));
  border:1px solid rgba(227,181,88,.42);box-shadow:0 14px 40px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.06);
  white-space:pre-wrap;word-break:break-word;pointer-events:none;
  animation:qpopIn .12s ease-out}
@keyframes qpopIn{from{opacity:0;transform:translateY(-3px) scale(.98)}to{opacity:1;transform:none}}
.qpop[hidden]{display:none}
/* REPO 状态行：左文字、右按钮 */
.gitstate-row{display:flex;align-items:center;gap:6px;margin-top:7px}
.gitstate-row .gitstate{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gitstate-row .gitico{width:22px;height:22px}

/* REPO 状态行里的齿轮：红/绿状态（不再依赖 .gitgear 容器） */
.gitico.is-bad{color:#ff9a86 !important;border-color:rgba(255,107,90,.8) !important;background:rgba(255,90,70,.12) !important;
  animation:gitBadGlow 1.5s ease-in-out infinite}
@keyframes gitBadGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(255,107,90,0);border-color:rgba(255,107,90,.45)}
  50%{box-shadow:0 0 12px 3px rgba(255,107,90,.65);border-color:rgba(255,140,120,.95)}
}
.gitico.is-ok{color:#7ee0a8 !important;border-color:rgba(120,224,168,.6) !important;background:rgba(120,224,168,.10) !important}
/* 未读提醒：更强的呼吸光（透明图标按钮也能看到） */
.attn{color:#ffd479 !important;background:rgba(255,196,64,.14) !important;border-radius:6px;
  animation:attnGlow 1.25s ease-in-out infinite, attnShake 1.9s ease-in-out infinite}
.iconbtn.attn::after,.notif__btn.attn::after{content:'';position:absolute;top:3px;right:3px;width:6px;height:6px;
  border-radius:50%;background:#ff6b5a;box-shadow:0 0 6px rgba(255,107,90,.9)}

/* 分支命名开头 */
.prefrow{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 6px}
.prefchip{padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);
  color:#9aa3a7;font-size:10.5px;cursor:pointer;white-space:nowrap}
.prefchip:hover{border-color:rgba(160,220,255,.6);color:#e6edf0}
.prefchip.is-on{background:rgba(120,190,255,.16);border-color:rgba(140,210,255,.7);color:#eaf6ff}
.prefhint{font-size:10px;color:#7f888b;margin:0 0 6px}
.prefhint code{color:#cfd7da}

.gitbtn .gitbadge{width:16px !important;height:16px !important;min-width:16px !important;padding:0 !important;
  border-radius:8px !important;text-align:center;font:600 10px/16px var(--font-mono) !important;
  top:1px !important;right:1px !important}

/* REPO 分支编辑行 */
.gitbranchrow{display:flex;align-items:center;gap:5px;margin-top:7px}
.gitbranchrow select{flex:0 0 auto;background:rgba(255,255,255,.04);color:#cfd7da;border:1px solid rgba(255,255,255,.14);
  border-radius:5px;font:11px var(--font-mono);padding:3px 4px;outline:none}
.gitbranchrow select:hover{border-color:rgba(160,220,255,.6)}
.gitbranchrow input{flex:1 1 auto;min-width:0;background:rgba(255,255,255,.04);color:#e6edf0;
  border:1px solid rgba(255,255,255,.14);border-radius:5px;font:11px var(--font-mono);padding:3px 6px;outline:none}
.gitbranchrow input:focus{border-color:rgba(160,220,255,.75)}
.gitbranchrow input.is-bad{border-color:rgba(255,107,90,.85);color:#ffb4a8}
.gitstat--two{grid-template-columns:repeat(2,1fr) !important}

/* REPO 状态一行三列：左 / 中 / 右 */
.gitstat--three{display:grid !important;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:6px;text-align:left}
.gitstat--three > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gitstat--three .st-mid{text-align:center}
.gitstat--three .st-right{text-align:right;white-space:nowrap;overflow:visible}
/* 同步日志标题行：文字 + 右侧工具按钮 */
.gitlog summary{display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none}
.gitlog summary::-webkit-details-marker{display:none}
.gitlog summary .gitlog__t{margin-left:auto;display:flex;gap:5px}
.gitlog summary .gitlog__t .gitico{width:20px;height:20px}

/* 自绘分支前缀下拉 */
.gitsel{position:relative;flex:0 0 auto}
.gitsel__btn{display:flex;align-items:center;gap:4px;min-width:82px;justify-content:space-between;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  color:#dbe3e7;border:1px solid rgba(255,255,255,.16);border-radius:6px;
  font:600 11px var(--font-mono);padding:4px 6px;cursor:pointer}
.gitsel__btn:hover{border-color:rgba(160,220,255,.7);color:#fff;background:rgba(120,190,255,.10)}
.gitsel__btn i{font-style:normal;opacity:.7;font-size:9px}
.gitsel__menu{position:absolute;z-index:40;top:calc(100% + 5px);left:0;min-width:190px;padding:4px;
  border-radius:8px;background:linear-gradient(180deg,rgba(26,31,36,.99),rgba(16,20,23,.99));
  border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 34px rgba(0,0,0,.6)}
.gitsel__menu[hidden]{display:none}
.gitsel__item{display:flex;align-items:baseline;gap:6px;width:100%;text-align:left;padding:5px 7px;border:0;
  border-radius:5px;background:transparent;color:#cfd7da;font:11px/1.5 var(--font-mono);cursor:pointer}
.gitsel__item:hover{background:rgba(120,190,255,.14);color:#fff}
.gitsel__item.is-on{color:#8fd0ff}
.gitsel__item span{color:#7f888b;font:10px var(--font-ui);margin-left:auto}
/* 输入框：和 REPO 一致的暗色卡 */
.gitbranchrow input{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.16);color:#e6edf0;border-radius:6px;padding:4px 8px;font:11px var(--font-mono)}
.gitbranchrow input::placeholder{color:#6f777b}
.gitbranchrow input:focus{border-color:rgba(160,220,255,.8);box-shadow:0 0 0 2px rgba(120,190,255,.15);outline:none}

/* 提示条 / 气泡要压在弹窗之上，否则设置里的报错看不到 */
.toasts{z-index:200000 !important}
.qpop{z-index:210000 !important}

/* 推送文件选择窗口 */
.pushtree{max-height:min(52vh,430px);overflow:auto;border:1px solid rgba(255,255,255,.1);border-radius:8px;
  background:rgba(0,0,0,.26);padding:4px 2px;margin:8px 0}
.prow{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:5px;font:11px/1.6 var(--font-mono);color:#cfd7da}
.prow:hover{background:rgba(255,255,255,.05)}
.prow.is-dir{color:#e6edf0;font-weight:600}
.prow.is-locked{background:rgba(255,90,70,.10);color:#ff9a86 !important}
.prow.is-locked .prow__name{text-decoration:line-through;opacity:.85}
.prow__ind{flex:0 0 auto;width:10px;color:#6f777b}
.prow__chev{flex:0 0 auto;width:14px;text-align:center;color:#8d9499;cursor:pointer}
.prow__box{flex:0 0 auto;width:13px;height:13px;border-radius:3px;border:1px solid rgba(255,255,255,.3);
  display:grid;place-items:center;cursor:pointer;color:#0d1013;font-size:10px;line-height:1}
.prow__box.on{background:#7ee0a8;border-color:#7ee0a8}
.prow__box.part{background:rgba(126,224,168,.35);border-color:rgba(126,224,168,.8)}
.prow__box.hidden{visibility:hidden}
.prow__name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow__st{flex:0 0 auto;font-size:9.5px;color:#8d9499;border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:0 4px}
.prow__st.st-A{color:#7ee0a8;border-color:rgba(126,224,168,.5)}
.prow__st.st-D{color:#ff9a86;border-color:rgba(255,110,90,.5)}
.prow__st.st-M{color:#ffcf70;border-color:rgba(227,181,88,.5)}
.prow__lock{flex:0 0 auto;width:18px;height:18px;display:grid;place-items:center;border-radius:4px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);cursor:pointer;color:#9aa3a7}
.prow__lock:hover{color:#fff;border-color:rgba(160,220,255,.7)}
.prow__lock.on{color:#ff6b5a;border-color:rgba(255,107,90,.8);background:rgba(255,90,70,.15)}
.prow__lock svg{width:11px;height:11px}
.pushtools{display:flex;gap:6px;align-items:center;margin:8px 0 2px}
.pushtools .n{margin-left:auto;font-size:10.5px;color:#8d9499}

/* 固定尺寸的弹窗内容（避免折叠/展开时整体跳动） */
.modalfix{width:min(760px,94vw);height:min(78vh,720px);display:flex;flex-direction:column;min-height:0}
.modalfix--push{width:min(720px,94vw);height:min(78vh,680px)}
.modalfix .modal__body{flex:1 1 auto;min-height:0;overflow:auto}
.modalfix .modal__foot{flex:0 0 auto}
.modalfix--push .pushtree{flex:1 1 auto;min-height:0;max-height:none;overflow:auto}

/* 提交描述：右下角可拖动调整高度 */
.pushbody{resize:vertical;min-height:58px;max-height:220px;line-height:1.6;font-family:var(--font-ui);width:100%}

.prow__note{margin-left:8px;font:10px/1.5 var(--font-ui);color:#7f8a90;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.prow.is-locked .prow__note{color:#c98a83}

/* ================= Git 画布书签 ================= */
.gmkc.is-stale{opacity:.42;filter:grayscale(1)}
.gmk__btn.is-stale{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#8d9499;cursor:not-allowed}


/* 收起时只让竖排 GIT 左移 2px（图标不动） */
.gmk:not(.is-open) .gmk__label{transform:translateX(-2px)}
/* 有新画布（仓库里有没看过的版本）时的提醒 */
.gmk.has-new .gmk__tab{animation:gmkNewBreath 2.05s ease-in-out infinite}
@keyframes gmkAlert{
  0%,100%{filter:drop-shadow(0 4px 10px rgba(0,0,0,.5)) drop-shadow(0 0 2px rgba(76,214,140,.35));
          transform:scale(1);opacity:.92;background:rgba(76,214,140,.85)}
  35%{filter:drop-shadow(0 6px 18px rgba(0,0,0,.5)) drop-shadow(0 0 16px rgba(90,255,170,.95))
          drop-shadow(0 0 28px rgba(60,220,140,.55));
       transform:scale(1.07);opacity:1;background:rgba(120,255,180,1)}
  60%{filter:drop-shadow(0 6px 16px rgba(0,0,0,.5)) drop-shadow(0 0 8px rgba(76,214,140,.7));
       transform:scale(1.02);opacity:1;background:rgba(96,240,165,1)}
}

.gmk{position:absolute;left:100%;right:auto;top:4.5px;margin-left:1.5px;z-index:4200;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none}
.gmk>*{pointer-events:auto}
.gmk__tab{position:relative;width:34px;height:25px;border:0;
  background:rgba(76,214,140,.95);
  color:#8ff0bb;display:flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;padding:0;border-radius:0 7px 7px 0;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%);
  filter:drop-shadow(0 5px 12px rgba(0,0,0,.55));
  transition:width .34s cubic-bezier(.22,1.4,.36,1), filter .3s, color .2s, padding .3s}
/* 内层：深色填充，inset 1px 之后自然露出 1px 橙色描边（含尖角） */
.gmk__tab::before{content:'';position:absolute;inset:1px;border-radius:0 6px 6px 0;
  background:linear-gradient(180deg,rgba(18,34,26,.98),rgba(11,22,17,.98));
  clip-path:inherit}
.gmk__tab>*{position:relative;z-index:1}
.gmk__tab:hover{color:#c6ffdd;}
.gmk.is-open .gmk__tab{width:348px;justify-content:flex-start;padding-left:12px;animation:none;border-radius:0 7px 0 0;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%);
  background:rgba(96,230,158,1);
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.6))}
.gmk__tab svg{width:13px;height:13px;opacity:.9;flex:0 0 auto}
.gmk__label{writing-mode:vertical-rl;font:8.5px/1 var(--font-ui);letter-spacing:.06em;opacity:.8}
.gmk.is-open .gmk__label{display:none}
.gmk__title{display:none}
.gmk.is-open .gmk__title{display:inline;font:11px/1 var(--font-ui);letter-spacing:.06em;color:#b6ffd4;white-space:nowrap}
@keyframes gmkBreath{
  0%,100%{filter:drop-shadow(0 4px 10px rgba(0,0,0,.5)) drop-shadow(0 0 0 rgba(76,214,140,0))}
  50%{filter:drop-shadow(0 5px 14px rgba(0,0,0,.55)) drop-shadow(0 0 6px rgba(76,214,140,.55))}
}
.gmk__panel{position:relative;width:348px;max-height:min(62vh,560px);overflow:auto;
  margin:0;background:linear-gradient(180deg,rgba(24,29,33,.985),rgba(15,19,22,.985));
  border:1px solid rgba(255,255,255,.12);border-top:0;border-radius:0 0 10px 10px;
  box-shadow:0 20px 46px rgba(0,0,0,.66);padding:8px 9px 10px;
  opacity:0;transform:translateY(-4px);transform-origin:top left;transition:opacity .22s,transform .26s cubic-bezier(.22,1.3,.36,1)}
.gmk.is-open .gmk__panel{opacity:1;transform:none}
.gmk__panel[hidden]{display:none}
.gmk__h{display:flex;align-items:center;gap:6px;padding:2px 2px 7px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:6px}
.gmk__h b{font-size:11.5px;color:#e6edf0}
.gmk__h .n{margin-left:auto;font-size:10px;color:#8d9499}
.gmkv{margin-bottom:6px;border:1px solid rgba(255,255,255,.08);border-radius:8px;overflow:hidden;background:rgba(255,255,255,.02)}
.gmkv__h{display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:pointer;background:rgba(255,255,255,.03)}
.gmkv__h:hover{background:rgba(255,255,255,.06)}
.gmkv__chev{width:12px;color:#8d9499}
.gmkv__h b{font-size:11px;color:#dfe7ea}
.gmkv__sha{font:9.5px var(--font-mono);color:#7f888b;border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:0 4px}
.gmkv__n{margin-left:auto;font-size:10px;color:#8d9499}
.gmkv__items{padding:4px 5px 6px}
.gmkv__items.is-shut{display:none}
.gmkc{padding:6px 7px;border:1px solid rgba(255,255,255,.08);border-radius:7px;margin:4px 0;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));cursor:pointer;
  transition:border-color .18s,background .18s,opacity .25s,filter .25s}
.gmkc:hover{border-color:rgba(255,180,110,.45);background:rgba(255,149,65,.07)}
.gmkc.is-applied{opacity:.5;filter:grayscale(.85)}
.gmkc__top{display:flex;align-items:center;gap:6px}
.gmkc__top b{font-size:11px;color:#e6edf0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gmk__btn{margin-left:auto;flex:0 0 auto;font:10px/1 var(--font-ui);padding:3px 8px;border-radius:5px;
  border:1px solid rgba(120,224,168,.55);background:rgba(120,224,168,.12);color:#9df0c4;cursor:pointer}
.gmk__btn:hover{background:rgba(120,224,168,.22)}
.gmk__btn.is-undo{border-color:rgba(255,149,65,.6);background:rgba(255,149,65,.12);color:#ffc48c}
.gmkc__line{display:flex;align-items:center;gap:5px;margin-top:3px;font:9.5px var(--font-ui);color:#8d9499}
.gmkc__line .tags{margin-left:auto;display:flex;gap:3px}
.gmk__empty{font-size:10.5px;color:#8d9499;line-height:1.7;padding:8px 4px}
/* 主画布卡片：标签移到标题下一行、右对齐 */
.cv__line{display:flex;align-items:center;gap:5px;min-width:0}
.cv__tags{margin-left:auto;display:flex;gap:3px;flex:0 0 auto}

/* 书签卡片：缩略图 + 内容 */
.gmkc{display:flex;gap:7px;align-items:flex-start}
.gmkc__fig{flex:0 0 auto;width:34px;height:42px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12);
  border-radius:4px;background:radial-gradient(60% 50% at 50% 45%,#1b2124,#0b0e12)}
.gmkc__body{flex:1 1 auto;min-width:0}
/* 临时查看提示条 */
.gmkview{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:24000;display:flex;align-items:center;gap:8px;
  padding:6px 8px 6px 6px;border-radius:8px;background:linear-gradient(180deg,rgba(18,34,26,.97),rgba(11,22,17,.97));
  border:1px solid rgba(90,230,160,.55);box-shadow:0 12px 30px rgba(0,0,0,.55);color:#c9f5dc;font-size:11px}
.gmkview b{color:#eafff2}
.gmkview__ico{font:600 9px var(--font-mono);letter-spacing:.08em;color:#0d1a13;background:#5fe0a0;border-radius:4px;padding:2px 4px}
.gmkview__x{margin-left:4px;padding:2px 8px;border-radius:5px;border:1px solid rgba(120,240,180,.6);
  background:rgba(120,240,180,.14);color:#c9f5dc;font-size:10px;cursor:pointer}
.gmkview__x:hover{background:rgba(120,240,180,.26)}

/* 最近改动（回收站）母栏 */
#cvTrash{flex:0 0 auto}
.ctrash{margin:8px 8px 4px;border:1px dashed rgba(255,255,255,.14);border-radius:8px;background:rgba(255,255,255,.02)}
.ctrash__h{display:flex;align-items:center;gap:6px;padding:5px 8px;cursor:pointer;color:#cfd7da;font-size:11px}

.ctrash__chev{width:10px;color:#8d9499}
.ctrash__n{margin-left:auto;font:9.5px var(--font-mono);color:#8d9499}

.ctr{display:flex;align-items:center;gap:6px;padding:4px 5px;border-radius:5px;cursor:default}
.ctr:hover{background:rgba(255,255,255,.05)}

.ctr__tag{flex:0 0 auto;font:9px var(--font-ui);padding:1px 5px;border-radius:4px;border:1px solid rgba(255,255,255,.16);color:#9aa3a7}

.ctr__tag.is-delete{color:#ff9a86;border-color:rgba(255,110,90,.5);background:rgba(255,90,70,.08)}
.ctrmenu{position:fixed;z-index:99999;min-width:110px;padding:4px;border-radius:7px;

/* 关联折叠按钮：左侧彩色竖条（升级版） */
.cv.cv--parent{grid-template-columns:22px 40px minmax(0,1fr) auto}

  border:1px solid var(--lk);border-radius:6px;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(0,0,0,.32));
  color:var(--lk);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.45);
  transition:box-shadow .18s,border-color .18s,background .18s,transform .18s;z-index:5}

.cv__fold.is-open svg{transform:rotate(90deg)}

.cv__warn{left:auto;right:5px;top:auto;bottom:4px}
.cv__linkmark{left:auto;right:15px;top:auto;bottom:5px}
.cv__mapmark{left:auto;right:25px;top:auto;bottom:5px}

.cv__fold{position:absolute;left:4px;bottom:4px;width:24px;height:24px;min-width:0;min-height:0;padding:0;

/* 关联/映射：超小方框字母标记 */
.cv__mark{position:absolute;top:3px;width:12px;height:12px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  font:8px/1 var(--font-mono);font-weight:700;letter-spacing:0;z-index:6;background:rgba(8,11,12,.72);border:1px solid;box-shadow:0 1px 4px rgba(0,0,0,.5)}

/* 折叠按钮恢复：左侧彩色竖条（占一列） */
.cv.cv--parent{grid-template-columns:22px 40px minmax(0,1fr) auto}
.cv__fold{position:relative;left:auto;bottom:auto;width:22px;height:40px;min-height:40px;padding:2px 0;
