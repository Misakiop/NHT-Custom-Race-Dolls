<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>解剖编辑器 · Nice Health Tab</title>
<link rel="icon" id="favicon" href="data:,">
<style>
/* ============ tokens ============ */
:root{
  --bg:#0a0c0d;
  --panel:#111416;
  --panel-2:#15191b;
  --raise:#1b2023;
  --raise-2:#232a2e;
  --line:#252b2f;
  --line-2:#333c41;
  --paper:#f3f0ea;
  --text:#dcd9d3;
  --muted:#8d9499;
  --dim:#5d6569;
  --accent:#ff9541;
  --accent-2:#ffb26b;
  --on-accent:#1c1105;
  --danger:#e2564a;
  --warn:#e3b558;
  --ok:#7fbd8e;
  --prosth:#8fb6d2;
  --font-ui:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --font-disp:"Bahnschrift SemiCondensed","Bahnschrift","DIN Condensed","Arial Narrow",var(--font-ui);
  --font-mono:"Cascadia Mono","Consolas","SF Mono","Roboto Mono",monospace;
  --r:3px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:12px/1.5 var(--font-ui);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
img{-webkit-user-drag:none;user-select:none}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card .ico svg{width:20px;height:20px}
.tray__head svg{width:12px;height:12px}
.selhead__badge svg{width:15px;height:15px}
.mini svg{width:100%;height:100%}
.raceinfo__head svg{width:13px;height:13px}
.help-list svg{width:12px;height:12px}
.help-p svg{width:12px;height:12px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #0d1011;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:#2d363b;border-radius:2px}
::selection{background:rgba(255,149,65,.3)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2b3237;border:2px solid transparent;background-clip:padding-box;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#3b444a;background-clip:padding-box;border:2px solid transparent}

/* ============ shell ============ */
.app{display:flex;flex-direction:column;height:100vh;min-height:560px}
.topbar{
  height:58px;flex:0 0 58px;display:flex;align-items:center;gap:18px;padding:0 14px 0 16px;
  background:linear-gradient(180deg,#14181a,#0f1214);
  border-bottom:1px solid var(--line);position:relative;z-index:120;
}
.topbar::after{content:"";position:absolute;left:0;top:0;width:196px;height:2px;background:linear-gradient(90deg,var(--accent),rgba(255,149,65,0))}
.brand{display:flex;align-items:center;gap:10px;min-width:196px}
.brand__mark{width:28px;height:28px;border-radius:4px;border:1px solid var(--line-2);background:#0b0e10;object-fit:contain;padding:1px}
.brand__txt{display:flex;flex-direction:column;line-height:1.15;gap:2px}
.brand__txt b{font-size:14px;font-weight:600;letter-spacing:.08em}
.brand__txt span{font:8.5px/1.2 var(--font-disp);letter-spacing:.2em;color:var(--dim)}
.topbar__mid{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.crumb{font:10px/1 var(--font-disp);letter-spacing:.16em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.crumb__sep{color:var(--line-2)}
.projName{
  flex:1;min-width:80px;max-width:520px;height:28px;background:transparent;border:1px solid transparent;border-radius:2px;
  padding:0 8px;font-size:12.5px;letter-spacing:.02em;color:var(--paper);
}
.projName:hover{border-color:var(--line)}
.projName:focus{outline:none;border-color:var(--line-2);background:#0d1011}
.topbar__actions{display:flex;align-items:center;gap:6px}
.vsep{width:1px;height:20px;background:var(--line);margin:0 4px}
/* 顶栏语言切换：折叠按钮 + 当前语言颜色/文字 */
.langbox{position:relative;flex:0 0 auto;margin-right:2px}
.langbtn{display:flex;align-items:center;gap:5px;height:26px;padding:0 7px;border:1px solid var(--line);
  border-radius:5px;background:rgba(255,255,255,.035);color:var(--text);cursor:pointer;font:10px/1 var(--font-ui)}
.langbtn:hover{background:rgba(255,255,255,.07);border-color:var(--line-2)}
.langdot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:#ff9a4d;box-shadow:0 0 7px rgba(255,154,77,.7)}
.langbox[data-lang="en"] .langbtn .langdot{background:#5cc8ff;box-shadow:0 0 7px rgba(92,200,255,.75)}
.langbtn b{font-weight:500;letter-spacing:.04em;white-space:nowrap}
.langbtn i{font-style:normal;font-size:9px;opacity:.55;margin-left:1px}
.langmenu{position:absolute;right:0;top:calc(100% + 5px);z-index:300;min-width:124px;padding:4px;
  border:1px solid var(--line);border-radius:6px;background:#14181b;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.langmenu[hidden]{display:none}
.langopt{display:flex;align-items:center;gap:6px;width:100%;padding:5px 7px;border:0;border-radius:4px;
  background:transparent;color:var(--text);cursor:pointer;font:11px/1.3 var(--font-ui);text-align:left}
.langopt:hover{background:rgba(255,255,255,.06)}
.langopt.is-on{background:rgba(255,255,255,.09)}
.langopt .langdot.zh{background:#ff9a4d;box-shadow:0 0 7px rgba(255,154,77,.7)}
.langopt .langdot.en{background:#5cc8ff;box-shadow:0 0 7px rgba(92,200,255,.75)}
.iconbtn{
  width:28px;height:28px;display:grid;place-items:center;border-radius:2px;border:1px solid transparent;color:var(--muted);
}
.iconbtn:hover{background:var(--raise);color:var(--text);border-color:var(--line)}
.iconbtn:disabled{opacity:.32;cursor:default;background:none;border-color:transparent}
.iconbtn--xs{width:22px;height:22px}
.iconbtn svg{width:15px;height:15px}
.btn{
  height:28px;padding:0 11px;display:inline-flex;align-items:center;gap:6px;border-radius:2px;
  border:1px solid var(--line-2);background:var(--raise);color:var(--text);
  font-size:11.5px;letter-spacing:.02em;white-space:nowrap;
}
.btn svg{width:14px;height:14px}
.btn:hover{background:var(--raise-2);border-color:#3f4a50}
.btn:active{transform:translateY(.5px)}
.btn--primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn--primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn--ghost{background:transparent;border-color:var(--line)}
.btn--ghost:hover{background:var(--raise)}
.btn--danger{color:var(--danger);border-color:rgba(226,86,74,.4);background:rgba(226,86,74,.07)}
.btn--danger:hover{background:rgba(226,86,74,.14);border-color:var(--danger)}
.btn--sm{height:26px;padding:0 9px;font-size:11px}
.btn--xs{height:22px;padding:0 7px;font-size:10.5px;gap:4px;border-radius:2px}
.btn--xs svg{width:11px;height:11px}
.btn--wide{width:100%;justify-content:center}
.btn--on{border-color:var(--accent);color:var(--accent);background:rgba(255,149,65,.09)}

.workspace{flex:1;display:grid;grid-template-columns:clamp(220px,20vw,288px) minmax(0,1fr) clamp(240px,22vw,310px);min-height:0}
.col{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.col--l{border-right:1px solid var(--line)}
.col--r{border-left:1px solid var(--line);background:var(--panel)}

/* ============ panels ============ */
.panel{display:flex;flex-direction:column;min-height:0;position:relative}
.panel--cvs{flex:0 0 auto;border-bottom:1px solid var(--line)}
.panel--cvs .panel__body{max-height:min(300px,38vh)}
.panel--tree{flex:1 1 auto}
.panel__head{
  display:flex;align-items:center;gap:8px;height:34px;flex:0 0 34px;padding:0 10px 0 12px;
  border-bottom:1px solid var(--line);background:var(--panel-2);
}
.panel__head .idx{font:9px/1 var(--font-disp);letter-spacing:.1em;color:var(--accent);opacity:.85}
.panel__head h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--text)}
.panel__head .count{
  font:10px/1 var(--font-mono);color:var(--muted);padding:2px 5px;border:1px solid var(--line);
  border-radius:2px;background:#0d1011;margin-left:auto;
}
.panel__head .iconbtn{margin-left:auto}
.panel__head .count + .iconbtn{margin-left:6px}
.panel__body{overflow:auto;padding:6px;min-height:0}
.panel__foot{display:flex;gap:6px;padding:6px;border-top:1px solid var(--line);background:var(--panel-2)}
.panel__foot .btn{flex:1;justify-content:center}

/* canvas cards */
.cv{
  display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:9px;
  padding:5px 8px 5px 6px;border:1px solid transparent;border-radius:3px;cursor:pointer;position:relative;
}
.cv + .cv{margin-top:2px}
.cv:hover{background:#171c1f;border-color:var(--line)}
.cv.is-on{background:linear-gradient(90deg,rgba(255,149,65,.12),rgba(255,149,65,.02));border-color:rgba(255,149,65,.34)}
.cv.is-on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--accent);border-radius:2px}
.cv__fig{
  width:40px;height:46px;position:relative;overflow:hidden;border:1px solid var(--line);
  border-radius:2px;background:radial-gradient(60% 50% at 50% 45%,#1b2124,#0b0e0f);
}
.cv__fig .mini{position:absolute;left:50%;top:50%;width:0;height:0}
.cv__fig .mini > div{position:absolute;left:0;top:0}
.cv__fig img{display:block;width:100%;height:100%}
.cv__txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.cv__txt b{font-size:12px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv__txt i{font:9.5px/1.4 var(--font-mono);font-style:normal;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv.is-on .cv__txt b{color:var(--paper)}
.cv__n{font:9px/1 var(--font-mono);color:var(--dim);align-self:start;margin-top:3px}
.cv__tag{
  font:8.5px/1 var(--font-disp);letter-spacing:.1em;padding:2px 4px;border:1px solid var(--line-2);
  border-radius:2px;color:var(--muted);text-transform:uppercase;
}
.cv.is-on .cv__tag{border-color:rgba(255,149,65,.4);color:var(--accent)}
.cv__del{
  position:absolute;right:4px;bottom:4px;z-index:2;opacity:0;width:16px;height:16px;
  display:grid;place-items:center;color:var(--dim);background:rgba(10,13,14,.8);
  border:1px solid var(--line);border-radius:3px;
}
.cv__del svg{width:10px;height:10px;stroke-width:2}
.cv:hover .cv__del{opacity:1}
.cv__del:hover{color:#fff;background:var(--danger);border-color:var(--danger)}

/* tree */
.grp{margin-bottom:2px}
.grp__head{
  display:flex;align-items:center;gap:6px;height:24px;padding:0 4px;border-radius:2px;
  cursor:pointer;color:var(--muted);user-select:none;
}
.grp__head:hover{background:#171c1f;color:var(--text)}
.grp__head .ico{width:13px;height:13px;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;color:var(--dim)}
.grp__head .ico--svg{background:none;color:var(--dim);display:grid;place-items:center}
.grp__head .ico--svg svg{width:12px;height:12px}
.grp__head b{font-size:10.5px;font-weight:600;letter-spacing:.12em}
.grp__head .n{font:9.5px/1 var(--font-mono);color:var(--dim);margin-left:auto}
.grp__chev{transition:transform .14s ease;color:var(--dim);display:grid;place-items:center}
.grp__chev svg{width:11px;height:11px}
.grp.is-closed .grp__chev{transform:rotate(-90deg)}
.grp.is-closed .grp__body{display:none}
.grp__body{padding-left:2px}
.row{
  display:grid;grid-template-columns:9px minmax(0,1fr) 26px 20px 20px;align-items:center;gap:4px;
  height:23px;padding:0 2px 0 4px;border-radius:2px;cursor:pointer;position:relative;
}
.row:hover{background:#171c1f}
.row.is-on{background:rgba(255,149,65,.1)}
.row.is-on::before{content:"";position:absolute;left:-2px;top:3px;bottom:3px;width:2px;background:var(--accent);border-radius:2px}
.row__dot{width:7px;height:7px;border-radius:50%;background:#4a6b54;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.row__dot.s-hurt{background:var(--warn)}
.row__dot.s-missing{background:var(--danger)}
.row__dot.s-prosthetic{background:var(--prosth)}
.row__name{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.row__name em{font:9px/1 var(--font-mono);font-style:normal;color:var(--dim);margin-left:5px}
.row.is-missing .row__name{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(226,86,74,.6)}
.row.is-hidden .row__name{opacity:.45}
.row__id{font:9px/1 var(--font-mono);color:var(--dim);text-align:right}
.row__act{width:20px;height:20px;display:grid;place-items:center;color:var(--dim);opacity:.5;border-radius:2px}
.row:hover .row__act{opacity:.9}
.row__act:hover{color:var(--paper);background:var(--raise-2)}
.row__act.is-active{color:var(--accent);opacity:1}
.row__act svg{width:12px;height:12px}
.row__act.is-custom{color:var(--accent)}
.tray{margin-top:6px;border:1px dashed var(--line-2);border-radius:3px;background:#0e1113}
.traybar{border-top:1px solid var(--line);background:#0c0f10;max-height:min(148px,26vh);overflow:auto;flex:0 0 auto}
.traybar__head{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;color:var(--muted);font-size:10px;letter-spacing:.1em;background:var(--panel-2);border-bottom:1px solid var(--line);position:sticky;top:0}
.traybar__head svg{width:12px;height:12px;color:var(--accent)}
.traybar__head span.n{margin-left:auto;font:9.5px/1 var(--font-mono);color:var(--dim)}
.traybar .tray__row{height:24px;padding:0 8px}
.traybar .tray__row button{font-size:10px;color:var(--accent);padding:0 6px;border:1px solid rgba(255,149,65,.3);border-radius:2px;height:18px;line-height:16px}
.traybar .tray__row button:hover{background:rgba(255,149,65,.12)}
.tray__head{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;color:var(--dim);font-size:10px;letter-spacing:.1em}
.tray__body{padding:0 4px 4px}
.tray__row{display:flex;align-items:center;gap:6px;height:22px;padding:0 4px;border-radius:2px;font-size:11px;color:var(--muted)}
.tray__row:hover{background:#171c1f;color:var(--text)}
.tray__row span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray__row button{font-size:10px;color:var(--accent);padding:0 4px}

/* ============ stage ============ */
.stage{
  position:relative;min-width:0;overflow:hidden;touch-action:none;
  background:radial-gradient(120% 85% at 50% -10%,#1c2225 0%,#0f1315 52%,#090b0c 100%);
}
.stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.085) 1px,transparent 1px);background-size:23px 23px;
  -webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000 20%,transparent 100%);
  mask-image:radial-gradient(70% 70% at 50% 50%,#000 20%,transparent 100%);opacity:.5;
}
.tick{position:absolute;width:11px;height:11px;border:1px solid rgba(255,149,65,.28);pointer-events:none}
.tick--tl{left:12px;top:12px;border-right:0;border-bottom:0}
.tick--tr{right:12px;top:12px;border-left:0;border-bottom:0}
.tick--bl{left:12px;bottom:12px;border-right:0;border-top:0}
.tick--br{right:12px;bottom:12px;border-left:0;border-top:0}
.stage__bar{
  position:absolute;left:clamp(8px,2vw,34px);top:16px;display:flex;gap:4px;z-index:30;margin-top:0;
  flex-wrap:wrap;overflow:visible;max-width:calc(100% - 16px);pointer-events:none;
  scrollbar-width:thin;
  background:rgba(11,14,15,.72);border:1px solid var(--line);border-radius:3px;padding:3px;backdrop-filter:blur(6px);
}
.stage__bar > *{pointer-events:auto}
.chip{
  height:23px;padding:0 8px;display:inline-flex;align-items:center;gap:5px;border-radius:2px;
  font-size:10.5px;color:var(--muted);letter-spacing:.04em;border:1px solid transparent;
}
.chip svg{width:12px;height:12px;opacity:.8}
.chip__ico{width:12px;height:12px;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;opacity:.8}
.chip:hover{background:var(--raise);color:var(--text)}
.chip.is-on{background:rgba(255,149,65,.13);border-color:rgba(255,149,65,.3);color:var(--accent-2)}
.stage__bar-sep{width:1px;height:16px;background:var(--line);margin:3px 3px 0}
.chip--sw{gap:7px;padding:0 8px}
.sw{position:relative;display:inline-block;width:22px;height:12px;border-radius:7px;background:#2a3136;transition:background .15s}
.sw i{position:absolute;left:1px;top:1px;width:10px;height:10px;border-radius:50%;background:#79838a;transition:transform .16s cubic-bezier(.2,.8,.3,1),background .16s}
.chip--sw.is-on .sw{background:rgba(255,149,65,.5)}
.chip--sw.is-on .sw i{transform:translateX(10px);background:var(--accent)}
.switch{position:relative;display:inline-block;width:34px;height:18px;flex:0 0 34px;border-radius:10px;background:#232a2e;border:1px solid var(--line-2);cursor:pointer;transition:background .16s,border-color .16s}
.switch i{position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#6f787d;transition:transform .16s cubic-bezier(.2,.8,.3,1),background .16s}
.switch.is-on{background:rgba(255,149,65,.22);border-color:rgba(255,149,65,.55)}
.switch.is-on i{transform:translateX(16px);background:var(--accent)}
.swrow{display:flex;align-items:center;gap:9px;padding:2px 0 4px}
.swrow b{font-size:11.5px;font-weight:600}
.swrow span{font:9.5px/1.4 var(--font-mono);color:var(--dim)}
.grp__tag{font:8px/1 var(--font-disp);letter-spacing:.12em;padding:2.5px 4px;border:1px solid rgba(255,149,65,.45);border-radius:2px;color:var(--accent);flex:0 0 auto}
.stage__sel{
  position:absolute;left:34px;bottom:26px;z-index:3;display:none;align-items:center;gap:8px;
  padding:4px 9px;border:1px solid var(--line);border-radius:3px;background:rgba(11,14,15,.75);
  font:10px/1.4 var(--font-mono);color:var(--muted);backdrop-filter:blur(6px);max-width:46%;
}
.stage__sel b{color:var(--paper);font-family:var(--font-ui);font-weight:600;font-size:11px}
.stage__sel .k{color:var(--accent)}
/* fixed-size detail windows: never scale with the canvas, but can be moved / resized */
.dollwins{position:absolute;inset:0;z-index:3;pointer-events:none}
.dollwin{
  position:absolute;left:0;top:0;overflow:hidden;border-radius:4px;pointer-events:auto;cursor:grab;
  background:linear-gradient(180deg,rgba(15,19,21,.9),rgba(9,12,13,.86));
  border:1px solid var(--line-2);box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.03);
  touch-action:none;
}
.dollwin.is-pinned{cursor:default}
.dollwin.is-dragging{cursor:grabbing;border-color:rgba(255,149,65,.55);box-shadow:0 20px 44px rgba(0,0,0,.6)}
.dollwin::after{
  content:"";position:absolute;inset:0;border-radius:3px;pointer-events:none;z-index:1;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:9px 9px;opacity:.5;
}
.dollwin.is-pinned::before{
  content:"";position:absolute;inset:0;border-radius:4px;pointer-events:none;z-index:2;
  box-shadow:inset 0 0 0 1px rgba(255,149,65,.42);
}
.dollwin__bar{
  position:absolute;left:0;right:0;top:0;height:22px;display:flex;align-items:center;gap:6px;
  padding:0 3px 0 8px;z-index:3;cursor:grab;user-select:none;
  background:linear-gradient(180deg,#1c2225,#13181a);border-bottom:1px solid var(--line-2);
}
.dollwin.is-pinned .dollwin__bar{cursor:default}
.dollwin__bar b{
  flex:1;min-width:0;font:10px/1 var(--font-ui);font-weight:600;letter-spacing:.06em;color:#dee4e6;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dollwin__body{position:absolute;left:0;right:0;top:22px;bottom:0;overflow:hidden;background-repeat:no-repeat;background-position:center;background-size:cover}
.dollwin__body .wpart{position:absolute;transform:translate(-50%,-50%);transform-origin:50% 50%;pointer-events:none}
.dollwin__body .wpart img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
/* the click / drag surface is the painted pixels only, not the transparent texture box */
.dollwin__body .wpart__hit{
  position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:grab;
  border-radius:2px;
}
.dollwin__body .wpart.is-sel .wpart__hit{outline:1px solid var(--accent);outline-offset:1px;background:rgba(255,149,65,.08)}
.dollwin.is-pinned .dollwin__body .wpart__hit{cursor:default}
.dollwin__pin{
  position:relative;flex:0 0 18px;width:18px;height:18px;display:grid;place-items:center;z-index:4;
  border-radius:3px;background:rgba(8,10,11,.5);border:1px solid transparent;color:#8d9499;cursor:pointer;
}
.dollwin__pin svg{width:11px;height:11px}
.dollwin__pin:hover{color:#fff;border-color:var(--line-2);background:rgba(20,25,27,.9)}
.dollwin.is-pinned .dollwin__pin{color:var(--accent);border-color:rgba(255,149,65,.45);background:rgba(255,149,65,.14)}
.dollwin__grip{
  position:absolute;right:0;bottom:0;width:15px;height:15px;z-index:4;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 48%,rgba(255,149,65,.5) 50%,rgba(255,149,65,.5) 58%,transparent 60%,transparent 70%,rgba(255,149,65,.5) 72%,rgba(255,149,65,.5) 80%,transparent 82%);
  opacity:.5;
}
.dollwin:hover .dollwin__grip{opacity:.95}
.dollwin.is-pinned .dollwin__grip{display:none}
.zoomer{
  position:absolute;right:34px;bottom:26px;z-index:3;display:flex;align-items:center;gap:2px;
  border:1px solid var(--line);background:rgba(11,14,15,.75);border-radius:3px;padding:3px;backdrop-filter:blur(6px);
}
.stage__empty{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;text-align:center;
  pointer-events:none;color:var(--dim);max-width:280px;
}
.stage__empty-ico{
  display:block;width:38px;height:38px;margin:0 auto 12px;color:#4a5459;
}
.stage__empty-ico svg{width:38px;height:38px;stroke-width:1.2}
.stage__empty b{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.stage__empty p{margin:0;font-size:10.5px;line-height:1.8}
.zoomer button{width:24px;height:23px;display:grid;place-items:center;color:var(--muted);border-radius:2px;font:13px/1 var(--font-mono)}
.zoomer button:hover{background:var(--raise);color:var(--text)}
.zoomer svg{width:13px;height:13px}
.zoomer span{min-width:44px;text-align:center;font:10px/1 var(--font-mono);color:var(--muted)}

.board{position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:0 0;will-change:transform}
.board__grid{
  position:absolute;left:-2400px;top:-2400px;width:4800px;height:4800px;pointer-events:none;
  background-image:
    linear-gradient(to right,rgba(255,255,255,.05) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(255,255,255,.05) 1px,transparent 1px),
    linear-gradient(to right,rgba(255,255,255,.028) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;
}
.board__grid.is-off{display:none}
.axis{position:absolute;pointer-events:none;background:rgba(255,149,65,.16)}
.axis--x{height:1px;left:-2400px;width:4800px;top:0}
.axis--y{width:1px;top:-2400px;height:4800px;left:0}
.bounds{position:absolute;pointer-events:none;border:1px dashed rgba(255,255,255,.11);border-radius:2px}
/* the mod's own BoundingBox for this doll: anything outside gets clipped in game */
.gbounds{position:absolute;pointer-events:none;border:1px solid rgba(255,149,65,.55);border-radius:2px;background:rgba(255,149,65,.03)}
.gbounds.is-bad{border-color:rgba(226,86,74,.85);background:rgba(226,86,74,.06)}
.gbounds .gbounds__lab{
  position:absolute;left:0;top:-15px;font:9px/1 var(--font-mono);color:rgba(255,149,65,.85);white-space:nowrap;letter-spacing:.04em;
}
.gbounds.is-bad .gbounds__lab{color:rgba(226,86,74,.95)}
/* a part that would be clipped by the in-game canvas */
.part.is-overflow{outline:none}
.ovf-box{position:absolute;pointer-events:none;border:1px dashed rgba(226,86,74,.8);border-radius:2px;box-shadow:0 0 0 1px rgba(226,86,74,.25)}

/* layer stack list in the canvas inspector */
.stack{display:flex;flex-direction:column;gap:1px;max-height:220px;overflow:auto}
.stack__row{display:flex;align-items:center;gap:8px;width:100%;padding:2px 6px;border:0;background:transparent;color:var(--text);text-align:left;border-radius:3px;cursor:pointer}
.stack__row:hover{background:rgba(255,255,255,.05)}
.stack__row.is-on{background:rgba(255,149,65,.16);color:#fff}
.stack__n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.stack__row b{font:10px/1 var(--font-mono);color:var(--dim)}
.stack__row.is-on b{color:var(--accent)}
.stack__row em{font-style:normal;color:var(--dim)}

.part .ovf{  position:absolute;right:-2px;top:-9px;background:rgba(226,86,74,.92);color:#fff;
  font:8px/1.35 var(--font-mono);padding:1px 3px;border-radius:2px;pointer-events:none;letter-spacing:.04em;
}
.bounds__lab{
  position:absolute;right:0;top:-15px;font:9px/1 var(--font-mono);color:rgba(255,255,255,.22);
  white-space:nowrap;letter-spacing:.04em;
}
.parts{position:absolute;left:0;top:0}
.part{position:absolute;left:0;top:0;transform-origin:50% 50%;cursor:grab;will-change:transform;filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
.part:active{cursor:grabbing}
.part img{display:block;width:100%;height:100%;pointer-events:none}
.part.is-locked{cursor:default}
.part.is-hidden{display:none}
/* a part freshly created in the tree, waiting for its texture */
.part--empty{
  outline:1px dashed rgba(255,149,65,.6);outline-offset:0;border-radius:3px;
  background:rgba(255,149,65,.08);
}
.part__ph{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:#ff9541;font:9px/1.1 var(--font-mono);text-align:center;pointer-events:none;
}
.part__ph svg{width:13px;height:13px}
.part__ph i{font-style:normal;white-space:nowrap}
.row.is-drop{outline:1px dashed var(--accent);outline-offset:-1px;background:rgba(255,149,65,.13)}
.row.is-dragging{opacity:.4}
.row.is-over-top{box-shadow:inset 0 2px 0 var(--accent)}
.row.is-over-bottom{box-shadow:inset 0 -2px 0 var(--accent)}
.row[draggable="true"]{cursor:grab}
/* hitbox: the selected part's box is editable (corner handles + centre dot) */

/* per-part armor / notify icon (the def's <notifyPosition>) */
.ico image{opacity:.85;pointer-events:none}
.ico__l{stroke:rgba(120,220,120,.45);stroke-width:.7;stroke-dasharray:2 2;pointer-events:none}
.ico__h{fill:rgba(120,220,120,.12);stroke:rgba(120,220,120,.85);stroke-width:.8;vector-effect:non-scaling-stroke;pointer-events:all;cursor:move}
.ico.is-on .ico__h{fill:rgba(120,220,120,.28);stroke:#fff}

/* 护甲图标模式：只留整体轮廓 + 图标 */
/* 护甲视图：不再把身体压到几乎不可见；外形交给 .is-xray 变黑，器官/骨骼保持正常亮度 */
.is-icons .part.is-outer img{opacity:1}
.is-icons .part .wound,.is-icons .part .tint,.is-icons .part .cross,.is-icons .part .ovf{display:none}
.is-icons .part.is-selected{filter:none}

/* 图标模式：部位不抢鼠标，盾牌才能随便拖 */
.is-icons .part{pointer-events:none !important}
.is-icons .parts{pointer-events:none}
.ico .ico__hit{fill:transparent;stroke:none;pointer-events:all;cursor:move}
.ico:hover .ico__h{stroke:#fff;fill:rgba(120,220,120,.35)}
.hit-h{fill:#0d1011;stroke:var(--accent);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:auto;cursor:nwse-resize}
.hit-m{fill:var(--accent);stroke:#0d1011;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:auto;cursor:move}
.hit.is-on{stroke:var(--accent);stroke-dasharray:4 3;fill:rgba(255,149,65,.08);pointer-events:none}
.sel-box.is-faint{stroke:rgba(255,255,255,.22);stroke-dasharray:2 4}
.tile.is-dragging{opacity:.45}
/* x-ray view: the skin turns into a dark silhouette so the white organs / bones read clearly */
.is-xray .part.is-outer img{filter:brightness(.17) saturate(0)}
.is-xray .part.is-outer .wound{opacity:.45}
.is-xray .part.is-inner img{filter:drop-shadow(0 0 5px rgba(255,255,255,.22))}
.is-xray .part.is-selected.is-outer img{filter:brightness(.24) saturate(0)}
.part.is-missing img{filter:brightness(0) saturate(0);opacity:.52}
.part.is-missing .wound{display:none}
/* hurt: the whole part is tinted by the injury colour, intensity follows severity */
.part .tint{
  position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
  -webkit-mask-position:center;mask-position:center;
}
.is-xray .part .tint{opacity:.35 !important}
.part--hurt .wound{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:normal}
.wound i{position:absolute;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;color:#c5382c}
.part .cross{
  position:absolute;left:50%;top:50%;width:46%;height:46%;transform:translate(-50%,-50%);
  background:var(--danger);-webkit-mask:var(--mask) no-repeat center/contain;mask:var(--mask) no-repeat center/contain;
  opacity:.85;pointer-events:none;
}
.part:hover{filter:drop-shadow(0 10px 22px rgba(0,0,0,.55)) drop-shadow(0 0 5px rgba(255,149,65,.45))}
.part.is-selected{filter:drop-shadow(0 10px 24px rgba(0,0,0,.6)) drop-shadow(0 0 6px rgba(255,149,65,.55))}
.ov{position:absolute;left:-2000px;top:-2000px;width:4000px;height:4000px;overflow:visible;pointer-events:none;z-index:20000}
.ov .sel-box{fill:none;stroke:var(--accent);stroke-width:1.2;vector-effect:non-scaling-stroke}
.ov .sel-line{stroke:rgba(255,149,65,.5);stroke-width:1}
.ov .sel-h{fill:#0d1011;stroke:var(--accent);stroke-width:1.2;pointer-events:all;cursor:nwse-resize}
.ov .sel-h:hover{fill:var(--accent)}
.ov .rot{fill:#0d1011;stroke:var(--accent);stroke-width:1.2;pointer-events:all;cursor:grab}
.ov .rot:hover{fill:var(--accent)}
.ov .guide{stroke:rgba(255,149,65,.75);stroke-width:1;stroke-dasharray:4 4}
.ov .hit{fill:none;stroke:rgba(143,182,210,.45);stroke-width:1;stroke-dasharray:3 3}

/* ============ right ============ */
.tabs{display:flex;height:38px;flex:0 0 38px;border-bottom:1px solid var(--line);background:var(--panel-2);padding:0 6px;gap:2px}
.tab{
  position:relative;padding:0 12px;height:100%;font-size:11.5px;letter-spacing:.06em;color:var(--muted);
  border-bottom:2px solid transparent;display:flex;align-items:center;gap:5px;
}
.tab:hover{color:var(--text)}
.tab.is-on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .dot{width:5px;height:5px;border-radius:50%;background:var(--danger);display:none}
.tab.has-issue .dot{display:block}
.pane{flex:1;overflow:auto;min-height:0;scrollbar-gutter:stable}
.pane[hidden]{display:none}
.sec{padding:10px 12px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec__h{display:flex;align-items:center;gap:7px;margin-bottom:8px;color:var(--dim)}
.sec__h b{font:10px/1 var(--font-disp);letter-spacing:.18em;font-weight:600;color:var(--muted)}
.sec__h::after{content:"";flex:1;height:1px;background:var(--line)}
.sec__h .tagx{font:9px/1 var(--font-mono);color:var(--dim);letter-spacing:0}
.field{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:8px;padding:3px 0}
.field > label{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.field > .ctl{min-width:0;display:flex;align-items:center;gap:4px}
.field--wide{grid-template-columns:1fr}
.field--wide > label{margin-bottom:4px;display:block}
.field--wide .ctl{display:block}
.inp{
  width:100%;height:26px;background:#0d1011;border:1px solid var(--line);border-radius:2px;
  padding:0 7px;font:11px/1 var(--font-mono);color:var(--text);
}
.inp:hover{border-color:var(--line-2)}
.inp:focus{outline:none;border-color:var(--accent);background:#0b0e0f}
.inp--txt{font-family:var(--font-ui);font-size:11.5px}
.inp--sm{height:24px}
select.inp{font-family:var(--font-ui);font-size:11px;padding-right:2px}
.unit{font:9.5px/1 var(--font-mono);color:var(--dim);flex:0 0 auto}
.num2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg{display:flex;gap:2px;background:#0d1011;border:1px solid var(--line);border-radius:3px;padding:2px}
.seg button{
  flex:1;height:23px;border-radius:2px;font-size:10.5px;color:var(--muted);letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.seg button:hover{background:var(--raise);color:var(--text)}
.seg button.on{background:var(--raise-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg button.on[data-v="hurt"]{color:var(--warn);box-shadow:inset 0 0 0 1px rgba(227,181,88,.5)}
.seg button.on[data-v="missing"]{color:var(--danger);box-shadow:inset 0 0 0 1px rgba(226,86,74,.5)}
.seg button.on[data-v="prosthetic"]{color:var(--prosth);box-shadow:inset 0 0 0 1px rgba(143,182,210,.5)}
.rowline{display:flex;gap:6px;align-items:center}
.rowline .btn{flex:1;justify-content:center}
.sec__actions{display:flex;justify-content:flex-end;padding-top:2px}
.sec__actions .btn{flex:0 0 auto}
/* race picker (a mod can ship several races) */
.racepick__list{display:flex;flex-direction:column;gap:5px;max-height:52vh;overflow:auto}
.racepick{
  display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:7px 9px;
  border:1px solid var(--line);border-radius:3px;background:var(--raise);cursor:pointer;color:inherit;
}
.racepick:hover{border-color:var(--accent);background:#141a1c}
.racepick b{font-size:12px;color:var(--paper)}
.racepick em{font:9.5px/1 var(--font-mono);color:var(--dim);font-style:normal;grid-row:1;grid-column:2}
.racepick span{font-size:10px;color:var(--muted);grid-column:1/-1}
.mini-note{font-size:10px;line-height:1.6;color:var(--dim);margin:6px 0 0}
.kv{display:grid;grid-template-columns:64px 1fr;gap:6px;font:10px/1.6 var(--font-mono);color:var(--muted)}
.kv b{color:var(--dim);font-weight:400}
.pill{display:inline-flex;align-items:center;gap:4px;height:17px;padding:0 6px;border-radius:9px;font:9px/1 var(--font-mono);border:1px solid var(--line-2);color:var(--muted)}
.pill--a{color:var(--accent);border-color:rgba(255,149,65,.4);background:rgba(255,149,65,.08)}
.pill--c{color:var(--prosth);border-color:rgba(143,182,210,.35);background:rgba(143,182,210,.07)}
.selhead{display:flex;align-items:flex-start;gap:8px;padding:10px 12px 9px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#181d20,#121617)}
.selhead__badge{
  width:30px;height:30px;flex:0 0 30px;border:1px solid var(--line-2);border-radius:3px;display:grid;place-items:center;
  background:#0d1011;color:var(--accent);font:11px/1 var(--font-mono);
}
.selhead__t{min-width:0;flex:1}
.selhead__t b{display:block;font-size:12.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selhead__t span{font:9.5px/1.5 var(--font-mono);color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:26px 18px;text-align:center;color:var(--dim)}
.empty__ico{width:34px;height:34px;margin:0 auto 10px;background:currentColor;opacity:.5;
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.empty b{display:block;color:var(--muted);font-size:11.5px;font-weight:600;margin-bottom:4px}
.empty p{margin:0;font-size:10.5px;line-height:1.7}

/* library */
.libsearch{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid var(--line)}
.libsearch svg{width:13px;height:13px;color:var(--dim);flex:0 0 auto}
.libsearch .inp{border:0;background:#0d1011;height:26px;border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:3px;padding:8px 12px;border-bottom:1px solid var(--line)}
.chips button{height:21px;padding:0 7px;font-size:10px;border:1px solid var(--line);border-radius:2px;color:var(--muted);background:#0d1011}
.chips button:hover{border-color:var(--line-2);color:var(--text)}
.chips button.on{background:rgba(255,149,65,.12);border-color:rgba(255,149,65,.4);color:var(--accent)}
.presets{padding:10px 12px;border-bottom:1px solid var(--line)}
.presets__row{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.presets button{
  height:24px;padding:0 8px;font-size:10.5px;border:1px solid var(--line-2);border-radius:2px;background:var(--raise);
  color:var(--muted);display:inline-flex;align-items:center;gap:5px;
}
.presets button:hover{border-color:var(--accent);color:var(--accent-2);background:rgba(255,149,65,.08)}
.presets button svg{width:12px;height:12px;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px 12px 10px}
.libgrp{display:flex;align-items:center;gap:7px;padding:11px 12px 0;color:var(--dim);cursor:pointer;user-select:none}
.libgrp:hover{color:var(--text)}
.libgrp b{font:9.5px/1 var(--font-disp);letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.libgrp.is-open b{color:var(--accent)}
.libgrp.hair b{color:#c9a86a}
.libgrp.hair.is-open b{color:var(--accent)}
.libgrp.hair.sub{padding-left:26px;padding-top:6px}
.libgrp.hair.sub b{font-size:9px;letter-spacing:.12em;color:#a8977a}
.libgrp.sub{padding-left:26px;padding-top:6px}
.libgrp.sub b{font-size:9px;letter-spacing:.12em;color:#8b9a9d}
.libgrp.sub.is-open b{color:var(--accent)}
/* 我的素材: user folders + right-click menu */
.mine__bar{padding:4px 12px 2px}
.libgrp.mine__f{border-radius:3px}
.libgrp.mine__f.is-over{background:rgba(255,149,65,.12);outline:1px solid var(--accent)}
.grid[data-drop-folder]{border-radius:4px}
.grid[data-drop-folder].is-over{outline:1px dashed var(--accent);outline-offset:2px}
.tile__wrap{display:block;border-radius:4px}
.tile__wrap.is-over{outline:2px solid var(--accent);outline-offset:-1px}
.tile__wrap .tile{width:100%}
/* hairstyle shown as a visual reference only */
.part.hair-ref{pointer-events:auto;cursor:move;opacity:.9;z-index:9000}
.part.hair-ref img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 1px rgba(255,149,65,.8))}
.part.hair-ref::after{content:"";position:absolute;inset:0;outline:1px dashed rgba(255,149,65,.55);outline-offset:1px;border-radius:2px}
.part.hair-ref.is-locked{pointer-events:none;opacity:.95}
.part.hair-ref.is-locked::after{display:none}   /* locked = clean preview, no frame */
.part.hair-ref.is-snap::after{outline-color:rgba(159,208,138,.95);outline-style:solid;outline-width:2px}
.hair-refbar{display:flex;align-items:center;gap:6px;padding:2px 12px 4px}
.hair-refbar .btn{flex:1}
.row__act.mine__pen{opacity:.7}
.ctx{
  position:fixed;z-index:9999;min-width:190px;max-width:260px;padding:4px;
  background:var(--panel);border:1px solid var(--line-2);border-radius:4px;
  box-shadow:0 10px 30px rgba(0,0,0,.55);
}
.ctx__h{font:9px/1 var(--font-disp);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:6px 8px 3px}
.ctx__t{font:10px/1.3 var(--font-mono);color:var(--muted);padding:0 8px 6px;word-break:break-all}
.ctx__list{max-height:180px;overflow:auto}
.ctx__i{
  display:flex;align-items:center;gap:7px;width:100%;padding:6px 8px;border:0;border-radius:3px;
  background:none;color:var(--text);font-size:11.5px;text-align:left;cursor:pointer;
}
.ctx__i:hover{background:var(--raise);color:var(--accent)}
.ctx__i span{width:12px;color:var(--dim)}
.ctx__i.is-on span{color:var(--accent)}
.ctx__i.is-dim{color:var(--dim);cursor:default}
.ctx__i.is-dim:hover{background:none;color:var(--dim)}
.libadd--two{display:flex;gap:5px;margin-top:5px}
.libadd--two .btn{flex:1;justify-content:center;padding:0 5px;font-size:10.5px;white-space:nowrap}
.libadd--two .btn svg{width:12px;height:12px}
/* body-part picker (searchable) */
.inp--pick{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;cursor:pointer;width:100%}
.inp--pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inp--pick svg{width:12px;height:12px;color:var(--dim);flex:0 0 auto}
.inp--pick:hover{border-color:var(--accent)}
.bidpick{width:min(520px,90vw);display:flex;flex-direction:column;max-height:70vh}
.bidpick__search{display:flex;align-items:center;gap:7px;padding:0 12px 10px}
.bidpick__search svg{width:13px;height:13px;color:var(--dim)}
.bidpick__list{overflow:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:3px}
.bidrow{
  display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;
  padding:6px 9px;border:1px solid transparent;border-radius:3px;background:var(--raise);
  color:var(--text);cursor:pointer;font-size:11.5px;
}
.bidrow:hover{border-color:var(--accent);background:#141a1c}
.bidrow.is-on{border-color:var(--accent);color:var(--accent)}
.bidrow b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bidrow i{font:9px/1 var(--font-mono);color:var(--accent);font-style:normal}
.bidrow__def{font:9px/1 var(--font-mono);color:#7e8c8f;font-style:normal;margin-left:auto;padding-left:8px;white-space:nowrap}
.bidrow.is-on .bidrow__def{color:var(--accent)}
.libgrp>span{width:9px;font:9px/1 var(--font-mono);color:#4a5559}
.libgrp span{font:9px/1 var(--font-disp);letter-spacing:.18em;text-transform:uppercase}
.libgrp i{font:9px/1 var(--font-mono);color:#3f484d;font-style:normal}
.libgrp::after{content:"";flex:1;height:1px;background:var(--line)}
.tile--hair .tile__img{background:rgba(201,168,106,.06);border-color:rgba(201,168,106,.25)}
.tile--hair:hover .tile__img{border-color:var(--accent)}
.tile{
  display:flex;flex-direction:column;gap:3px;padding:4px;border:1px solid var(--line);border-radius:3px;
  background:#0d1011;text-align:left;position:relative;overflow:hidden;
}
.tile:hover{border-color:var(--accent);background:#141a1c}
.tile__img{
  height:56px;border-radius:2px;background-color:#0a0c0d;background-repeat:no-repeat;background-position:center;
  background-size:contain;border:1px solid rgba(255,255,255,.05);
  background-image:linear-gradient(45deg,#12181a 25%,transparent 25%,transparent 75%,#12181a 75%),linear-gradient(45deg,#12181a 25%,#0a0c0d 25%,#0a0c0d 75%,#12181a 75%);
  background-size:10px 10px,10px 10px;background-position:0 0,5px 5px;
}
.tile__img i{display:block;width:100%;height:100%;background-repeat:no-repeat;background-position:center;background-size:contain}
.tile b{font-size:10px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile i.d{font:8.5px/1 var(--font-mono);color:var(--dim);font-style:normal}
/* delete button on user-added materials (two taps: × -> 删除?) */
.tile__del{
  position:absolute;top:3px;right:3px;z-index:2;min-width:15px;height:15px;padding:0 3px;
  display:inline-flex;align-items:center;justify-content:center;border-radius:3px;cursor:pointer;
  background:rgba(9,12,13,.85);border:1px solid rgba(255,255,255,.12);color:#98a1a5;
  font:10px/1 var(--font-mono);
}
.tile__del:hover{color:#fff;border-color:#e2564a;background:rgba(226,86,74,.25)}
.tile__del.is-arm{color:#fff;background:#c5382c;border-color:#e2564a;font-size:9px;padding:0 4px}
.tile:hover b{color:var(--text)}
.libnote{padding:0 12px 14px;font-size:10px;color:var(--dim);line-height:1.7}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline}
.linkbtn:hover{color:var(--accent-2)}
/* progress bar (saving art to assets/) */
.prog{height:8px;border:1px solid var(--line);border-radius:4px;background:#0d1113;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .12s linear}

/* patch */
.scope{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.scope .btn{justify-content:center}
.actions{display:flex;flex-direction:column;gap:5px}
.actions .btn{justify-content:flex-start;height:30px}
.actions .btn .sub{margin-left:auto;font:9.5px/1 var(--font-mono);color:var(--dim)}
.issues{display:flex;flex-direction:column;gap:3px}
.issue{display:flex;gap:6px;align-items:flex-start;font-size:10.5px;line-height:1.5;padding:3px 5px;border-radius:2px;background:#0e1113;border-left:2px solid var(--line-2)}
.issue b{flex:0 0 auto;font:9px/1.6 var(--font-mono);color:var(--dim);text-transform:uppercase}
.issue--error{border-left-color:var(--danger)}
.issue--warn{border-left-color:var(--warn)}
.issue--info{border-left-color:var(--prosth)}
.issue--ok{border-left-color:var(--ok)}
pre.code{
  margin:0;padding:9px 10px;background:#080a0b;border:1px solid var(--line);border-radius:3px;
  font:9.5px/1.55 var(--font-mono);color:#9aa4a9;max-height:240px;overflow:auto;white-space:pre;tab-size:2;
}
pre.code .t{color:#c9a06a}
pre.code .a{color:#8fb6d2}
pre.code .c{color:#5d6569}
.codetools{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.codetools .n{margin-left:auto;font:9.5px/1 var(--font-mono);color:var(--dim)}

/* status */
.statusbar{
  height:30px;flex:0 0 30px;display:flex;align-items:center;gap:14px;padding:0 14px;
  border-top:1px solid var(--line);background:linear-gradient(180deg,#0f1214,#0b0e0f);
  font:10px/1 var(--font-mono);color:var(--dim);letter-spacing:.02em;
  position:relative;z-index:22000;
}
.statusbar__save{display:flex;align-items:center;gap:6px;color:var(--muted)}
.statusbar__save::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px rgba(127,189,142,.6)}
.statusbar__save.is-busy::before{background:var(--accent);box-shadow:0 0 6px rgba(255,149,65,.7)}
.statusbar__hint{flex:1;text-align:center;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusbar__meta{color:var(--muted);white-space:nowrap}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:95000;display:grid;place-items:center;background:rgba(6,8,9,.78);backdrop-filter:blur(2px);animation:fade .12s ease}
.modal__box{
  width:min(760px,94vw);max-height:88vh;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--line-2);border-radius:4px;box-shadow:0 40px 90px rgba(0,0,0,.65);
  animation:pop .16s cubic-bezier(.2,.8,.3,1);
}
.modal__head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal__head h3{margin:0;font-size:14px;font-weight:600;letter-spacing:.04em}
.modal__head .idx{font:9px/1 var(--font-disp);letter-spacing:.2em;color:var(--accent)}
.modal__head .x{margin-left:auto}
.modal__body{padding:16px;overflow:auto}
.modal__foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel-2)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{
  padding:11px;border:1px solid var(--line);border-radius:3px;background:#0e1113;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:5px;min-height:96px;
}
.card:hover{border-color:var(--line-2);background:#13181a}
.card.is-on{border-color:var(--accent);background:rgba(255,149,65,.07)}
.card b{font-size:12px;font-weight:600}
.card p{margin:0;font-size:10px;line-height:1.6;color:var(--dim)}
.card .ico{width:20px;height:20px;color:var(--muted)}
.card.is-on .ico{color:var(--accent)}
.filerow{display:flex;align-items:center;gap:8px;margin-top:12px}
.filerow .path{
  flex:1;min-width:0;height:30px;display:flex;align-items:center;padding:0 9px;border:1px dashed var(--line-2);
  border-radius:3px;font:10.5px/1 var(--font-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.filerow .path.is-set{border-style:solid;color:var(--text)}
.raceinfo{margin-top:12px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.raceinfo__head{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:11px}
.raceinfo__head b{color:var(--accent)}
.raceinfo__body{padding:8px 10px;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.raceinfo__body div{display:flex;gap:6px;font:10px/1.7 var(--font-mono);color:var(--muted);min-width:0}
.raceinfo__body span{color:var(--dim);flex:0 0 auto}
.raceinfo__body em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.raceparts{max-height:120px;overflow:auto;margin-top:6px;padding:0 10px 10px;display:flex;flex-wrap:wrap;gap:3px}
.raceparts i{font:9.5px/1 var(--font-mono);font-style:normal;padding:2px 5px;border:1px solid var(--line);border-radius:2px;color:var(--dim)}
.raceparts i.new{color:var(--accent);border-color:rgba(255,149,65,.4);background:rgba(255,149,65,.07)}
.toasts{position:fixed;left:50%;bottom:106px;transform:translateX(-50%);z-index:40000;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:3px;background:#161b1e;
  border:1px solid var(--line-2);border-left:2px solid var(--accent);color:var(--text);font-size:11.5px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);animation:tin .18s ease;max-width:70vw;
}
.toast svg{width:13px;height:13px;color:var(--accent);flex:0 0 auto}
.toast.is-danger{border-left-color:var(--danger)}
.toast.is-danger svg{color:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
kbd{
  display:inline-block;min-width:16px;padding:1px 5px;border:1px solid var(--line-2);border-bottom-width:2px;
  border-radius:3px;background:#0d1011;font:9.5px/1.5 var(--font-mono);color:var(--muted);text-align:center;
}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.help-list{display:flex;flex-direction:column;gap:5px}
.help-list div{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.help-list div span{margin-left:auto;display:flex;gap:3px}
.help-h{font:10px/1 var(--font-disp);letter-spacing:.18em;color:var(--dim);margin:0 0 9px}
.help-p{font-size:11px;line-height:1.8;color:var(--muted);margin:0 0 10px}
.help-p b{color:var(--text);font-weight:600}
.credit{display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--line);border-radius:3px;background:#0e1113;margin-top:10px}
.credit img{width:26px;height:26px}
.credit div{font-size:10.5px;color:var(--dim);line-height:1.6}
.credit div b{display:block;color:var(--muted);font-size:11px}

@media (max-width:1360px){
  .workspace{grid-template-columns:262px minmax(0,1fr) 288px}
  .field{grid-template-columns:58px minmax(0,1fr)}
}
@media (max-width:1180px){
  .workspace{grid-template-columns:238px minmax(0,1fr) 272px}
  .brand{min-width:0}
  .brand__txt span{display:none}
}

.fold{margin:12px 0 2px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(255,255,255,.02)}
.fold>summary{cursor:pointer;padding:10px 12px;font:12px/1.4 var(--font-ui);color:var(--muted);list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:'▸';display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary b{color:var(--ink);font-weight:600}
.fold__body{padding:0 12px 12px}
.fold__body select{width:100%}

.dbounds{position:absolute;pointer-events:none;border:2px dashed #31d0c6;border-radius:2px;
  background:rgba(49,208,198,.06);box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.dbounds__lab{position:absolute;left:0;top:-20px;padding:2px 6px;border-radius:5px;white-space:nowrap;
  background:rgba(49,208,198,.92);color:#04211f;font:600 10px/1.3 var(--font-mono)}

.dbounds{pointer-events:auto;cursor:move}
.dbounds.is-locked{cursor:default}
.dbounds__grip{position:absolute;right:-6px;bottom:-6px;width:14px;height:14px;border-radius:3px;
  background:rgba(49,208,198,.95);border:1px solid #04211f;cursor:nwse-resize;display:none}
.dbounds:hover .dbounds__grip{display:block}
.dbounds.is-locked .dbounds__grip{display:none}

.hairprev{position:absolute;pointer-events:none;background-repeat:no-repeat;background-size:100% 100%;
  opacity:.9;z-index:5;filter:drop-shadow(0 0 1px rgba(0,0,0,.6))}
.hairprev::after{content:'头发预览';position:absolute;left:0;top:0;padding:1px 4px;border-radius:4px;
  background:rgba(49,208,198,.9);color:#04211f;font:600 9px/1.3 var(--font-mono)}

.sec__rule{border:0;border-top:1px solid rgba(255,255,255,.10);margin:12px 0 4px}

.hairprev{pointer-events:auto;cursor:move}
.hairprev__grip{position:absolute;right:-6px;bottom:-6px;width:14px;height:14px;border-radius:3px;
  background:rgba(49,208,198,.95);border:1px solid #04211f;cursor:nwse-resize;display:none}
.hairprev:hover .hairprev__grip{display:block}

.hairfitline{margin:6px 0 2px;padding:6px 8px;border-radius:6px;background:rgba(49,208,198,.10);
  color:var(--ink);font:11px/1.5 var(--font-mono)}
.hairfitline b{color:#31d0c6}

.ruler{position:absolute;background:#171b1d;border-color:rgba(255,255,255,.10);z-index:40}
.ruler--x{left:0;right:0;top:0;height:18px;border-bottom:1px solid rgba(255,255,255,.10);z-index:60;
  background-image:repeating-linear-gradient(to right,rgba(255,255,255,.22) 0 1px,transparent 1px 25px);
  cursor:ns-resize}
.ruler--y{top:18px;bottom:0;left:0;width:18px;border-right:1px solid rgba(255,255,255,.10);z-index:60;
  background-image:repeating-linear-gradient(to bottom,rgba(255,255,255,.22) 0 1px,transparent 1px 25px);
  cursor:ew-resize}
.ruler__corner{position:absolute;left:0;top:0;width:18px;height:18px;background:#171b1d;z-index:61;
  border-right:1px solid rgba(255,255,255,.10);border-bottom:1px solid rgba(255,255,255,.10)}
.guides{position:absolute;left:-2400px;top:-2400px;width:4800px;height:4800px;pointer-events:none;z-index:45}
.guide-line{position:absolute;background:#31d0c6;pointer-events:auto}
.guide-line--h{left:0;right:0;height:1px;cursor:ns-resize}
.guide-line--v{top:0;bottom:0;width:1px;cursor:ew-resize}
.guide-line::after{content:'';position:absolute}
.guide-line--h::after{left:0;right:0;top:-3px;height:7px}
.guide-line--v::after{top:0;bottom:0;left:-3px;width:7px}
.guides.is-off{display:none}

.notes{position:absolute;left:0;top:0;width:0;height:0;z-index:70}
.note{position:absolute;min-width:120px;max-width:260px;padding:8px 20px 8px 10px;border-radius:8px;
  background:rgba(255,214,102,.94);color:#3a2c00;font:12px/1.5 var(--font-ui);cursor:move;
  box-shadow:0 6px 18px rgba(0,0,0,.35);transform:translate(0,0);white-space:pre-wrap;word-break:break-word}
.note--cyan{background:rgba(131,232,222,.95);color:#06302d}
.note--pink{background:rgba(255,178,205,.95);color:#3d0d20}
.note__x{position:absolute;right:4px;top:2px;width:16px;height:16px;border:0;border-radius:4px;
  background:rgba(0,0,0,.16);color:inherit;font:12px/1 var(--font-mono);cursor:pointer;padding:0}
.note__x:hover{background:rgba(0,0,0,.3)}

.band{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center}

.artchk{width:16px;height:16px;margin-left:6px;flex:0 0 16px;border-radius:3px;border:1px solid var(--line-2);
  background:#0f1416;color:var(--accent);font-size:11px;line-height:14px;text-align:center;cursor:pointer;padding:0}
.artchk.is-on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.artchk-bar{display:block;padding:6px 8px 8px;border-bottom:1px solid var(--line)}
.artchk-bar .btn{width:100%;justify-content:center}

.qmark{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;margin-left:5px;
  border-radius:50%;background:rgba(227,181,88,.18);border:1px solid rgba(227,181,88,.55);
  color:#e3b558;font-size:9px;font-weight:700;line-height:1;cursor:help;vertical-align:middle}
.qmark:hover{background:rgba(227,181,88,.34);color:#fff}

.dbounds.is-bad{border-color:#e2564a !important;border-style:solid !important;box-shadow:0 0 0 1px rgba(226,86,74,.55),0 0 14px rgba(226,86,74,.35);animation:dbad 1.2s ease-in-out infinite}
.dbounds.is-bad .dbounds__lab{background:rgba(226,86,74,.95);color:#fff}
@keyframes dbad{0%,100%{box-shadow:0 0 0 1px rgba(226,86,74,.55),0 0 14px rgba(226,86,74,.25)}50%{box-shadow:0 0 0 2px rgba(226,86,74,.85),0 0 20px rgba(226,86,74,.45)}}
.tab.is-off{opacity:.42}

.wip{display:inline-block;margin-left:6px;padding:0 5px;border-radius:8px;font-size:9px;line-height:14px;
  background:rgba(226,86,74,.16);border:1px solid rgba(226,86,74,.5);color:#e2564a;letter-spacing:.04em}

.cv.is-dragging{opacity:.45}
.cv.is-over{outline:1px dashed var(--accent);outline-offset:-2px;background:rgba(49,208,198,.10)}
.cv{cursor:grab}

.cv__off{display:inline-block;margin-top:2px;padding:0 5px;height:15px;line-height:15px;border-radius:7px;
  font:9.5px/15px var(--font-mono);color:#9fb6bd;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.10);cursor:pointer}
.cv__off:hover{color:#eaf6f4;border-color:var(--accent);background:rgba(49,208,198,.16)}
.field.is-flash{animation:flashField 1.3s ease-out}
@keyframes flashField{0%{background:rgba(49,208,198,.28)}100%{background:transparent}}

.gear{position:absolute;left:10px;bottom:10px;z-index:70}
.gear__btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:rgba(17,22,24,.9);
  color:#cfd8dc;font-size:15px;line-height:1;cursor:pointer;backdrop-filter:blur(6px)}
.gear__btn:hover,.gear__btn.is-on{border-color:var(--accent);color:var(--accent)}
.gear__panel{position:absolute;left:0;bottom:36px;width:148px;padding:4px;border-radius:6px;
  background:rgba(11,14,15,.96);border:1px solid var(--line-2);box-shadow:0 10px 26px rgba(0,0,0,.5)}
.gear__h{padding:4px 6px 5px;font:600 10px/1 var(--font-mono);color:#8d9499;letter-spacing:.06em}
.gear__panel button{display:block;width:100%;text-align:left;padding:5px 8px;border:0;border-radius:4px;
  background:transparent;color:#cfd8dc;font-size:11px;cursor:pointer}
.gear__panel button:hover{background:rgba(49,208,198,.16);color:#fff}

.chip--ico{display:inline-flex;align-items:center;gap:6px;padding:0 6px;height:23px}
.chip--ico svg.chip__ruler{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}

.notif{position:relative;display:inline-flex;align-items:center}
.notif__btn{position:relative;width:30px;height:30px}
.notif__ico{width:19px;height:19px}
.notif__dot{position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;

.hairprev--back{opacity:.75}

/* 骨骼 / 器官视图：头发同样压暗，和外形部位一致 */

.is-xray .part.hair-ref--back{opacity:.22}

/* 画布异种预览：圆形彩色图标，位于缩放浮窗上方 */
.vdock{position:absolute;right:34px;bottom:64px;z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;
  max-height:calc(100% - 120px);overflow:auto;padding:7px 6px;border:1px solid rgba(255,255,255,.13);border-radius:18px;
  background:linear-gradient(180deg,rgba(24,28,32,.92),rgba(12,15,17,.9));
  box-shadow:0 12px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.09);
  backdrop-filter:blur(10px);scrollbar-width:none}
.vdock::-webkit-scrollbar{display:none}
.vdock[hidden]{display:none}
.vdock__fold{flex:0 0 auto;width:18px;height:18px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.14);
  border-radius:50%;background:rgba(255,255,255,.05);color:#aeb8bd;cursor:pointer;font:9px/1 var(--font-mono);
  padding:0;transition:background .12s,color .12s}
.vdock__fold:hover{background:rgba(255,255,255,.12);color:#fff}
.vdock__dot{position:relative;flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.22);
  background:var(--dot,#666);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 2px 8px rgba(0,0,0,.35);
  padding:0;transition:transform .12s,box-shadow .12s}
.vdock__dot:hover{transform:scale(1.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 0 14px var(--dot)}
.vdock__dot.is-on{box-shadow:0 0 0 2px rgba(255,255,255,.92),0 0 14px var(--dot);transform:scale(1.06)}
.vdock__dot--base{background:conic-gradient(from 45deg,#aab3b7,#3b4348,#8e979c,#3b4348,#aab3b7)}
.vdock__dot--base::before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(255,255,255,.6)}
.vdock__dot::after{content:attr(data-lb);position:absolute;right:calc(100% + 9px);top:50%;transform:translateY(-50%);
  white-space:nowrap;padding:4px 7px;border-radius:5px;background:rgba(6,8,9,.9);border:1px solid rgba(255,255,255,.12);
  color:#f2f6f7;font:10px/1.2 var(--font-ui);opacity:0;pointer-events:none;transition:opacity .12s;z-index:3}
.vdock__dot:hover::after{opacity:1}
.vdock.is-closed .vdock__dot:not(.is-on){display:none}
.vdock.is-closed{padding:4px 5px;gap:4px}

/* 参考发型的后背层永远在所有部位之下（JS 里也会设置，这里是兜底） */
.hairprev--back{z-index:-1 !important}

/* 参考发型的后背层同样兜底到最底层 */
.hair-ref--back{z-index:-1 !important}

.cv__tag--har{color:#d8c6ff;background:rgba(120,86,220,.28);border:1px solid rgba(150,120,255,.5)}
.cv__tag--hairdef{color:#ffe0b0;background:rgba(210,150,60,.22);border:1px solid rgba(230,170,80,.45)}

.hairprev--ahoge::after{content:'呆毛层';position:absolute;left:0;top:auto;bottom:0;padding:1px 4px;border-radius:4px;
  background:rgba(120,200,255,.22);color:#cbe9ff;font-size:10px}

/* 呆毛层：只要图像，不要边框/虚线/文字标注 */
.hairprev--ahoge{pointer-events:none !important;opacity:1;border:0 !important;outline:0 !important;box-shadow:none !important}
.hairprev--ahoge::after{content:none !important;display:none !important}
.hairprev--ahoge .hairprev__grip{display:none !important}

/* 参考发型的呆毛层同样不加框和标签 */
.part.hair-ref--ahoge::after{content:none !important;outline:0 !important;display:none !important}
.part.hair-ref--ahoge{pointer-events:none !important;filter:none}
.part.hair-ref--ahoge img{filter:none}

/* 发色：用贴图自身的 alpha 当遮罩，只给有像素的地方乘上颜色 */
.hairprev::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:var(--tint,#fff);mix-blend-mode:multiply;
  -webkit-mask-image:var(--hairimg,none);mask-image:var(--hairimg,none);
  -webkit-mask-size:var(--maskSize,100% 100%);mask-size:var(--maskSize,100% 100%);
  -webkit-mask-position:var(--maskPos,0 0);mask-position:var(--maskPos,0 0);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
/* 参考发型不做染色遮罩（之前这层白底会把透明区染白） */
.part.hair-ref img{mix-blend-mode:normal}

  background:rgba(255,255,255,.04);list-style:none}

/* 未读提醒：黄色呼吸光 + 轻微抖动 */
@keyframes attnGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(255,196,64,0);color:#cfd7da;border-color:transparent}
  50%{box-shadow:0 0 12px 3px rgba(255,196,64,.75);color:#ffd479;border-color:rgba(255,196,64,.6)}
}
@keyframes attnShake{
  0%,100%{transform:translateX(0) rotate(0)}
  25%{transform:translateX(-1.5px) rotate(-4deg)}
  75%{transform:translateX(1.5px) rotate(4deg)}
}

/* 通知气泡：最高层（挂到 body 后 fixed 定位） */

/* 多选注入窗口 */
.mxgrp{border:1px solid rgba(255,255,255,.10);border-radius:6px;margin:0 0 6px;background:rgba(255,255,255,.02)}

/* 设置窗口里的路径行 */
