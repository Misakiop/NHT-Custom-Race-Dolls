<div data-tip>
  如果你<b>移动不了头发或某个部位</b>，不妨试试先<b>隐藏掉覆盖在其上面的部位</b>（左侧部位结构里点眼睛图标）。
</div>

<div data-tip>
  画布右上角的徽章是 HAR 头发检测：<b>红色三角</b> = 这个模组用了 HAR 头发但还没开自绘，点它可以直接跳过去开启。
</div>

<div data-tip>
  部位位置对不上时，先点「<b>可见框→命中框</b>」让判定框贴合可见像素，之后点选和拖动都会准很多。
</div>
